<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gestión personal de Benjamín Nuñez · Design | BNZ: tareas, economía, cronograma, presupuestos e IA.">
<meta name="theme-color" content="#262626">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Design BNZ Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral tinta (escritorio) → riel de íconos (tablet) → pestañas abajo (celular). Inicio = menú con mosaicos animados.
   Paleta de la marca: papel #F7E7D7 y tinta #262626; en oscuro se invierten. Cobre como acento. */
:root{
  --tinta:#262626; --papel:#F7E7D7;
  --bg:#F7E7D7; --surface:#FCF6F0; --surface-2:#F0DFCD; --line:#E0CBB6; --line-strong:#C9B19A;
  --fg:#262626; --fg-2:#574E46; --fg-3:#857869;
  --accent:#8E5F3A; --accent-soft:#EBD3BC; --accent-ink:#FCF6F0;
  --side-bg:#262626; --side-fg:#F7E7D7; --side-fg-2:#B8A99A; --side-line:#3A3734;
  --good:#3B7449; --good-soft:#DCE9DA; --bad:#A8412F; --bad-soft:#F3D6CE; --warn:#8F6512; --warn-soft:#F2E2BF;
  --wa:#1F7A4D;
  --shadow:0 1px 2px rgba(38,38,38,.06), 0 8px 24px rgba(38,38,38,.08);
  --shadow-up:0 2px 4px rgba(38,38,38,.08), 0 18px 40px rgba(38,38,38,.14);
  --f-display:'Montserrat','Segoe UI',Roboto,Arial,sans-serif;
  --f-body:'Montserrat','Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:12px; --r-sm:7px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#262626; --surface:#2F2D2B; --surface-2:#383532; --line:#45403B; --line-strong:#5A534C;
    --fg:#F7E7D7; --fg-2:#D3C4B5; --fg-3:#A09284;
    --accent:#D4A47A; --accent-soft:#4A3B2E; --accent-ink:#262626;
    --side-bg:#1C1C1C; --side-fg:#F7E7D7; --side-fg-2:#A89A8C; --side-line:#34312E;
    --good:#82C292; --good-soft:#2E3D31; --bad:#EC917F; --bad-soft:#4A2F29; --warn:#E3B567; --warn-soft:#463A22;
    --wa:#6FCF9B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --shadow-up:0 2px 4px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#262626; --surface:#2F2D2B; --surface-2:#383532; --line:#45403B; --line-strong:#5A534C;
  --fg:#F7E7D7; --fg-2:#D3C4B5; --fg-3:#A09284;
  --accent:#D4A47A; --accent-soft:#4A3B2E; --accent-ink:#262626;
  --side-bg:#1C1C1C; --side-fg:#F7E7D7; --side-fg-2:#A89A8C; --side-line:#34312E;
  --good:#82C292; --good-soft:#2E3D31; --bad:#EC917F; --bad-soft:#4A2F29; --warn:#E3B567; --warn-soft:#463A22;
  --wa:#6FCF9B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --shadow-up:0 2px 4px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
a{color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Animaciones ---------- */
@keyframes rise{from{transform:translateY(16px) scale(.985);opacity:.2}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:.2}to{opacity:1}}
@keyframes slideIn{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:calc(200px + 100%) 0}}
@keyframes barra{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@keyframes splashBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.entrar > *{animation:slideIn .38s var(--ease) both}
.entrar > *:nth-child(2){animation-delay:.04s} .entrar > *:nth-child(3){animation-delay:.08s} .entrar > *:nth-child(4){animation-delay:.12s} .entrar > *:nth-child(5){animation-delay:.16s} .entrar > *:nth-child(6){animation-delay:.2s}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--tinta);color:var(--papel);display:grid;place-items:center;animation:splashOut .35s ease 1.1s forwards}
#splash.fuera{animation:splashOut .3s ease forwards}
#splash .lg{display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-weight:900;font-size:clamp(34px,8vw,64px);letter-spacing:-.02em}
#splash .lg i{display:block;width:3px;height:1.05em;background:var(--papel);opacity:.55;transform-origin:center;animation:splashBar .6s var(--ease) .1s both}
#splash .lg span{animation:rise .6s var(--ease) both}
#splash .lg span:last-child{animation-delay:.12s}
#splash small{display:block;text-align:center;margin-top:14px;letter-spacing:.32em;font-size:11px;text-transform:uppercase;opacity:.75;animation:fade .8s ease .3s both}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,transform .12s var(--ease),box-shadow .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn-primary:hover{background:var(--fg-2);border-color:var(--fg-2)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.07);background:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--fg-2);padding:6px 8px}
.btn-ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn-ghost.danger:hover{color:var(--bad);background:var(--bad-soft)}
.btn-ghost[data-confirm="1"]{color:var(--bad);background:var(--bad-soft)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-wa{color:var(--wa)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);margin-bottom:5px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:13.5px;min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.45}
.inp.num{text-align:right;font-family:var(--f-mono)}
.campo{display:flex;flex-direction:column;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--fg-2);cursor:pointer;border-right:1px solid var(--line);transition:background .15s,color .15s}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--fg-2);white-space:nowrap;font-family:var(--f-mono)}
.pill.venc{border-color:transparent;background:var(--bad-soft);color:var(--bad)}
.pill.hoy{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.pill.alta{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.pill.ok{border-color:transparent;background:var(--good-soft);color:var(--good)}
.vacio{padding:18px;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--fg-3);font-size:13px;text-align:center}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2) 0,var(--line) 40%,var(--surface-2) 80%) var(--surface-2);background-size:200px 100%;background-repeat:no-repeat;animation:shimmer 1.2s infinite linear}

/* ---------- Estructura ---------- */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-fg);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.marca{display:block;cursor:pointer;background:none;border:0;padding:0 4px;text-align:left;color:inherit}
.marca .n{font-family:var(--f-display);font-weight:900;font-size:21px;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.marca .n i{width:2px;height:20px;background:var(--side-fg);opacity:.5;display:block}
.marca .l{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--side-fg-2);margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--side-fg-2);text-decoration:none;font-weight:600;font-size:13.5px;transition:color .15s,background .2s}
.nav a:hover{color:var(--side-fg);background:rgba(247,231,215,.07)}
.nav a[aria-current="page"]{color:var(--tinta);background:var(--papel)}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;opacity:.85}
.side-pie{margin-top:auto;display:grid;gap:10px;font-size:12px;color:var(--side-fg-2)}
.side-pie button{background:transparent;border:1px solid var(--side-line);color:var(--side-fg-2);border-radius:var(--r-sm);padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer;text-align:left}
.side-pie button:hover{color:var(--side-fg);border-color:var(--side-fg-2)}
.sync{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--side-fg-2);display:inline-block;flex:none}
.sync[data-s="ok"] i{background:#7DBE8C}
.sync[data-s="guardando"] i{background:#E3B567;animation:pulse 1s infinite}
.sync[data-s="error"] i{background:#EC917F}
.sync[data-s="local"] i{background:#E3B567}

main{min-width:0;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
@media (min-width:900px){ main{padding-left:34px;padding-right:34px} }
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:22px}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cab .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
.cab h1{font-size:28px;font-weight:800;letter-spacing:-.015em;margin-top:4px}
.cab p{margin:6px 0 0;color:var(--fg-2);max-width:62ch}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{font-size:15px;font-weight:700}
.panel-h .sub{font-size:12px;color:var(--fg-3)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:1020px){ .g3{grid-template-columns:minmax(0,1fr)} }
@media (max-width:820px){ .g2{grid-template-columns:minmax(0,1fr)} }
.aviso{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;padding:12px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-weight:600}
.aviso .btn{color:var(--fg)}

/* ---------- Inicio / menú ---------- */
.hero{position:relative;overflow:hidden;background:var(--tinta);color:var(--papel);border-radius:calc(var(--r) + 4px);padding:26px 26px 24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:26px;align-items:end}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(247,231,215,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(247,231,215,.06) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.hero > *{position:relative}
.hero .fecha{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;font-weight:700}
.hero .reloj{font-family:var(--f-mono);font-size:clamp(44px,7vw,76px);font-weight:500;line-height:1;margin-top:10px;letter-spacing:-.02em}
.hero h1{font-size:clamp(20px,2.6vw,26px);font-weight:800;margin-top:12px}
.hero p{margin:6px 0 0;opacity:.8;font-size:13.5px;max-width:52ch}
.hero-ia{background:rgba(247,231,215,.08);border:1px solid rgba(247,231,215,.18);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.hero-ia label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.8}
.hero-ia textarea{width:100%;min-height:74px;resize:vertical;border-radius:var(--r-sm);border:1px solid rgba(247,231,215,.22);background:rgba(0,0,0,.18);color:var(--papel);padding:10px 12px;font-size:13.5px;line-height:1.45}
.hero-ia textarea::placeholder{color:rgba(247,231,215,.5)}
.hero-ia textarea:focus{outline:none;border-color:var(--papel)}
.hero-ia .fila{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;opacity:.9}
.hero-ia .btn{background:var(--papel);color:var(--tinta);border-color:var(--papel)}
@media (max-width:860px){ .hero{grid-template-columns:minmax(0,1fr);padding:22px 18px} }

.mosaico{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:1180px){ .mosaico{grid-template-columns:repeat(3,minmax(0,1fr))} .tile.ia{grid-column:span 2} }
@media (max-width:640px){ .mosaico{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} }
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:150px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;cursor:pointer;color:var(--fg);overflow:hidden;animation:rise .5s var(--ease) both;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}.tile:nth-child(5){animation-delay:.2s}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-up);border-color:var(--line-strong)}
.tile:active{transform:translateY(-1px) scale(.99)}
.tile .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);transition:transform .3s var(--ease),background .2s}
.tile:hover .ic{transform:rotate(-6deg) scale(1.06)}
.tile .ic svg{width:21px;height:21px}
.tile .t{font-weight:800;font-size:15px}
.tile .d{font-size:12px;color:var(--fg-2);margin-top:2px}
.tile .big{font-family:var(--f-mono);font-size:24px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .flecha{position:absolute;top:16px;right:16px;opacity:.35;transition:transform .25s var(--ease),opacity .2s}
.tile:hover .flecha{transform:translateX(3px);opacity:.9}
.tile.ia{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.ia .ic{background:rgba(255,255,255,.18)}
.tile.ia .d{color:inherit;opacity:.85}
@media (max-width:640px){ .tile{min-height:122px;padding:13px} .tile .big{font-size:19px} .tile.ia{grid-column:1/-1;min-height:96px} }

/* Tira de cifras */
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cifra{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.cifra:last-child{border-right:0}
.cifra small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
.cifra b{display:block;font-family:var(--f-mono);font-weight:500;font-size:22px;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cifra span{font-size:12px;color:var(--fg-2)}
.cifra b.pos{color:var(--good)} .cifra b.neg{color:var(--bad)}
@media (max-width:600px){ .cifra{border-right:0;border-bottom:1px solid var(--line)} .cifra:last-child{border-bottom:0} }

/* Formularios en fila */
.form-fila{display:grid;gap:10px;align-items:end}
.form-tarea{grid-template-columns:minmax(0,2.4fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr) auto}
.form-evento{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,1.2fr) minmax(0,1fr) auto}
.form-mov{grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) auto}
@media (max-width:1100px){ .form-tarea,.form-evento,.form-mov{grid-template-columns:repeat(2,minmax(0,1fr))} .form-fila .ancho{grid-column:1/-1} }
.extra{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12.5px;color:var(--fg-2)}
.extra label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.extra .inp{width:auto;flex:1;min-width:180px}

/* Tareas */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filtros .inp{width:auto}
.col{min-width:0;border-radius:var(--r);transition:background .2s,box-shadow .2s;padding:2px}
.col.sobre{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.col-h{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:2px solid var(--fg);margin-bottom:10px}
.col-h h3{font-size:14px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.col-h span{font-family:var(--f-mono);font-size:12px;color:var(--fg-3)}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tarea{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 10px 11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);transition:transform .2s var(--ease),box-shadow .2s,opacity .25s}
.tarea[draggable="true"]{cursor:grab}
.tarea:hover{box-shadow:var(--shadow)}
.tarea.arrastrando{opacity:.4}
.tarea.saliendo{opacity:.3;transform:translateX(10px)}
.tarea.hecha .t-titulo{text-decoration:line-through;color:var(--fg-3)}
.check{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;margin-top:1px;color:transparent;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--fg)}
.hecha .check{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.check.pop{animation:pop .3s var(--ease)}
.check svg{width:12px;height:12px}
.t-titulo{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.t-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.t-nota{font-size:12.5px;color:var(--fg-2);margin-top:5px;overflow-wrap:anywhere}
.t-acc{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.t-acc .btn-ghost{font-size:12px}
.mini-link{font-size:11px;font-weight:600;color:var(--fg-3);text-decoration:none;border-bottom:1px dotted currentColor}
.mini-link:hover{color:var(--accent)}
.mini-link.wa:hover{color:var(--wa)}

/* Tablas */
.tabla-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700;padding:8px;border-bottom:1px solid var(--line-strong)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t .monto{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--fg)}
table.t tbody tr{animation:fade .3s ease both}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* Listas editables */
.ed-lista{display:grid;gap:6px}
.ed-fila{display:grid;grid-template-columns:minmax(0,1fr) 108px auto;gap:6px;align-items:center}
.ed-fila.con-check{grid-template-columns:auto minmax(0,1fr) 108px auto}
.ed-fila.con-tipo{grid-template-columns:auto minmax(0,1fr) 108px 104px auto}
.ed-fila .inp{padding:7px 9px;font-size:13px}
.ed-fila.hecho .inp:not(.num){text-decoration:line-through;color:var(--fg-3)}
.ed-total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--fg);margin-top:12px;padding-top:10px;font-weight:700}
.ed-total .num{font-size:16px;font-weight:500}
@media (max-width:520px){ .ed-fila.con-tipo{grid-template-columns:auto minmax(0,1fr) 96px auto} .ed-fila.con-tipo select{grid-column:2/4} }

/* Gráfico */
.graf{width:100%;height:auto;display:block}
.graf text{fill:var(--fg-3);font-family:var(--f-mono);font-size:11px}
.graf .grid{stroke:var(--line);stroke-width:1}
.graf .bar{fill:var(--accent);transform-box:fill-box;transform-origin:bottom;animation:barra .6s var(--ease) both}
.graf .hit{fill:transparent}
.graf g.col:hover .bar{fill:var(--fg)}
.graf .val{fill:var(--fg-2)}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-family:var(--f-mono);font-size:12px;padding:6px 9px;border-radius:6px;z-index:60;white-space:nowrap}
.meses{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px}
@media (max-width:600px){ .meses{grid-template-columns:repeat(3,minmax(0,1fr))} }
.meses label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.meses .inp{padding:6px 8px;font-size:12.5px}

/* Calendario */
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h2{font-size:17px;min-width:150px;text-align:center;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--fg-3);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.dia{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;border-top:0;border-left:0;font:inherit;color:inherit;transition:background .15s}
.dia:hover{background:var(--surface-2)}
.dia.fuera{background:var(--bg);color:var(--fg-3)}
.dia .d{font-family:var(--f-mono);font-size:12px;font-weight:500}
.dia.hoy .d{background:var(--fg);color:var(--bg);border-radius:4px;padding:0 5px;align-self:flex-start}
.dia.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ev{font-size:11px;line-height:1.3;padding:2px 5px;border-radius:4px;background:var(--accent-soft);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.tk{background:transparent;border:1px solid var(--line-strong);color:var(--fg-2)}
.ev.mas{background:transparent;color:var(--fg-3);padding-left:2px}
@media (max-width:700px){ .dia{min-height:54px;padding:4px} .ev{font-size:0;height:5px;padding:0;border-radius:3px} .ev.mas{display:none} }
.cron{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,350px);gap:22px;align-items:start}
@media (max-width:1100px){ .cron{grid-template-columns:minmax(0,1fr)} }
.agenda{list-style:none;margin:0;padding:0;display:grid}
.agenda li{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.agenda li:last-child{border-bottom:0}
.agenda .f{font-family:var(--f-mono);font-size:12px;color:var(--fg-2);line-height:1.3}
.agenda .f b{display:block;font-size:17px;color:var(--fg);font-weight:500}
.agenda .tt{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.agenda .mt{font-size:12px;color:var(--fg-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.agenda li.pasado .tt{color:var(--fg-3)}

/* IA */
.ia-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1020px){ .ia-wrap{grid-template-columns:minmax(0,1fr)} }
.ia-caja textarea{min-height:170px;font-size:14px}
.ejemplos{display:flex;gap:6px;flex-wrap:wrap}
.ejemplos button{border:1px dashed var(--line-strong);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--fg-2);cursor:pointer;transition:background .15s,color .15s}
.ejemplos button:hover{background:var(--surface-2);color:var(--fg)}
.adjuntos{display:flex;gap:8px;flex-wrap:wrap}
.adjuntos figure{margin:0;position:relative;width:70px;height:70px;border-radius:8px;overflow:hidden;border:1px solid var(--line);animation:rise .3s var(--ease) both}
.adjuntos img{width:100%;height:100%;object-fit:cover;display:block}
.adjuntos button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:var(--tinta);color:var(--papel);font-size:11px;cursor:pointer;line-height:1}
.pensando{display:flex;align-items:center;gap:10px;color:var(--fg-2);font-weight:600;font-size:13px}
.pensando::after{content:'';animation:dots 1.2s steps(4) infinite;display:inline-block;width:1.4em}
.pensando .orbe{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
.res-grupo{display:grid;gap:6px;margin-bottom:14px}
.res-grupo h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}
.res-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);animation:rise .35s var(--ease) both;cursor:pointer}
.res-item input{margin-top:3px}
.res-item .tt{font-weight:600;font-size:13.5px}
.res-item .mt{font-size:12px;color:var(--fg-3);display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.res-item.off{opacity:.5}
.chat{display:grid;gap:10px;max-height:420px;overflow-y:auto;padding:4px}
.burbuja{max-width:88%;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .3s var(--ease) both}
.burbuja.yo{justify-self:end;background:var(--fg);color:var(--bg);border-bottom-right-radius:4px}
.burbuja.ia{justify-self:start;background:var(--surface-2);border-bottom-left-radius:4px}
.wa-panel{display:grid;gap:10px;font-size:13px;color:var(--fg-2)}
.wa-panel ol{margin:0;padding-left:18px;display:grid;gap:6px}

/* Presupuestos */
.pres{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1100px){ .pres{grid-template-columns:minmax(0,1fr)} }
.pres-ed{display:grid;gap:16px}
.pres-ed .sec{display:grid;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.pres-ed .sec:last-child{border-bottom:0;padding-bottom:0}
.pres-ed h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-ed{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px;padding:10px;background:var(--surface-2);border-radius:var(--r-sm);animation:rise .3s var(--ease) both}
.item-ed .inp{padding:7px 9px;font-size:13px;background:var(--surface)}
.item-ed .pr{grid-column:1/3}
.item-ed .lt{grid-column:1/-1;text-align:right;font-size:12px;color:var(--fg-2);font-family:var(--f-mono)}
.hoja-wrap{overflow-x:auto;padding-bottom:6px}
/* La hoja es papel impreso: colores fijos de la marca en ambos temas */
.hoja{width:min(210mm,100%);min-height:min(297mm,140vh);margin:0 auto;background:#FFFFFF;color:#262626;box-shadow:var(--shadow);padding:16mm 15mm;font-family:var(--f-body);display:flex;flex-direction:column}
.h-cab{display:flex;justify-content:space-between;gap:20px;padding-bottom:16px;border-bottom:3px solid #262626;margin-bottom:22px}
.h-n{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:-.015em;margin:0}
.h-l{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#6B5E52;margin-top:4px}
.h-datos{font-size:12px;color:#574E46;line-height:1.7;margin-top:10px}
.h-badge{display:inline-block;background:#262626;color:#F7E7D7;padding:7px 16px;border-radius:4px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.h-meta{font-size:12.5px;color:#574E46;line-height:1.7;text-align:right}
.h-meta strong{color:#262626;font-family:var(--f-mono);font-weight:500}
.h-cli{background:#F7E7D7;border-radius:4px;padding:14px 16px;margin-bottom:22px}
.h-cli small{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8E5F3A}
.h-cli .cn{font-size:16px;font-weight:700;margin-top:3px}
.h-cli .cs{font-size:13px;color:#574E46}
table.h-t{width:100%;border-collapse:collapse;margin-bottom:18px}
table.h-t th{background:#262626;color:#F7E7D7;text-align:left;padding:9px 11px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
table.h-t td{padding:10px 11px;font-size:13px;border-bottom:1px solid #EADBCB;color:#262626}
table.h-t tbody tr:nth-child(even){background:#FBF5EF}
table.h-t .c{text-align:center;width:56px}
table.h-t .r{text-align:right;white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.h-tot{display:flex;justify-content:flex-end;margin-bottom:24px}
.h-tot table{border-collapse:collapse;width:290px}
.h-tot td{padding:8px 12px;font-size:13.5px}
.h-tot td:last-child{text-align:right;font-family:var(--f-mono)}
.h-tot .sub td{color:#574E46;border-bottom:1px solid #EADBCB}
.h-tot .tot td{background:#262626;color:#F7E7D7;font-weight:800;font-size:16px}
.h-notas{border:1px solid #EADBCB;border-radius:4px;padding:14px 16px;margin-bottom:20px}
.h-notas small{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8E5F3A}
.h-notas p{margin:6px 0 0;font-size:12.5px;line-height:1.6;white-space:pre-line;color:#3A342F}
.h-pie{margin-top:auto;text-align:center;font-size:11px;color:#857869;padding-top:14px;border-top:1px solid #EADBCB}
.ph{color:#A09284;font-style:italic}
.estado-sel{padding:4px 6px;font-size:12px}
@media (max-width:700px){ .hoja{padding:7mm 5mm} .h-cab{flex-direction:column} .h-meta{text-align:left} .h-tot table{width:100%} }

/* Modal y toasts */
.modal{position:fixed;inset:0;background:rgba(20,20,20,.5);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s ease both}
.modal-c{background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r);width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:22px;display:grid;gap:18px;box-shadow:var(--shadow-up);animation:rise .3s var(--ease) both}
.modal-c h2{font-size:18px}
.modal-c h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-weight:800;margin-bottom:10px}
.modal-c section{display:grid;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.modal-c section:last-of-type{border-bottom:0}
.modal-c p{margin:0;font-size:12.5px;color:var(--fg-2)}
.fila-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:12.5px;font-weight:600}
.msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
.respaldos{display:grid;gap:6px}
.respaldos div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:12.5px}
#toasts{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:70;display:grid;gap:8px;justify-items:end;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-up);animation:toastIn .3s var(--ease) both;max-width:min(360px,calc(100vw - 32px));transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(8px)}

/* Tablet: riel de íconos */
@media (max-width:1080px) and (min-width:701px){
  #app{grid-template-columns:76px minmax(0,1fr)}
  .side{padding:18px 8px;align-items:center}
  .marca .l,.nav a span:not(.cnt),.side-pie .txt{display:none}
  .marca .n{font-size:17px}
  .side .marca .w1,.side .marca .n i{display:none}
  .nav a{flex-direction:column;gap:3px;padding:9px 6px;font-size:10px;width:60px}
  .nav a .cnt{position:absolute;top:4px;right:6px;margin:0;font-size:9.5px}
  .nav a::after{content:attr(data-corto);font-size:10px}
  .side-pie{justify-items:center}
  .side-pie button{padding:6px;font-size:11px;text-align:center}
}
/* Celular: barra superior + pestañas abajo */
.topbar,.tabbar{display:none}
@media (max-width:700px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--side-bg);color:var(--side-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:11px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side-bg)}
  .topbar .marca .n{font-size:17px}
  .topbar .marca .n i{height:16px}
  .topbar button.aj{background:transparent;border:1px solid var(--side-line);color:var(--side-fg-2);border-radius:var(--r-sm);padding:6px 9px;font-size:12px;font-weight:600}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--side-bg);border-top:1px solid var(--side-line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;color:var(--side-fg-2);text-decoration:none;font-size:10px;font-weight:600;transition:color .2s}
  .tabbar a svg{width:30px;height:22px;padding:2px 6px;border-radius:6px;transition:background .2s,color .2s}
  .tabbar a[aria-current="page"]{color:var(--papel)}
  .tabbar a[aria-current="page"] svg{background:var(--papel);color:var(--tinta)}
  .tabbar a.ia-tab svg{width:50px;height:50px;padding:12px;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.35);border:3px solid var(--side-bg)}
  .tabbar a.ia-tab[aria-current="page"] svg{background:var(--papel);color:var(--tinta)}
  main{padding-bottom:110px;padding-top:18px}
  .cab h1{font-size:23px}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
}

/* ---------- Acceso por email (solo con Supabase) ---------- */
#acceso{position:fixed;inset:0;z-index:90;display:grid;place-items:center;overflow:auto;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background-color:var(--bg);background-image:linear-gradient(var(--line) 1px, transparent 1px),linear-gradient(90deg, var(--line) 1px, transparent 1px);background-size:24px 24px}
.rotulo{width:100%;max-width:420px;background:var(--surface);border:2px solid var(--fg);box-shadow:var(--shadow-up);animation:rise .4s var(--ease) both}
.rotulo-marca{background:var(--fg);color:var(--bg);padding:22px}
.rotulo-marca .m1{font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:-.01em}
.rotulo-marca .m1 span{font-weight:400;opacity:.55;margin:0 6px}
.rotulo-marca .m2{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;margin-top:6px;opacity:.85}
.rotulo form{padding:22px;display:grid;gap:12px}
.rotulo h1{font-size:20px}
.rotulo .ayuda{font-size:12.5px;color:var(--fg-2);margin:0}
.rotulo .msg{margin:0;min-height:1em}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div><div class="lg"><span>Design</span><i></i><span>BNZ</span></div><small>Diseño · Visualización · Tecnología</small></div></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<div class="tip" id="tip" hidden></div>

<script src="config.js"></script>
<script src="puente.js"></script>
<script>
(function(){
'use strict';

/* ---------------- Utilidades ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const isoDe = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoyISO = () => isoDe(new Date());
const deISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const sumarDias = (iso, n) => { const d = deISO(iso); d.setDate(d.getDate()+n); return isoDe(d); };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES_C = ['E','F','M','A','M','J','J','A','S','O','N','D'];
const DOW = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const ars0 = new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS', maximumFractionDigits:0});
const ars2 = new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS', minimumFractionDigits:2});

/* ---------------- Sincronización con la nube ---------------- */
const SY = { db:null, base:null, modo:'cargando', listo:{}, confirmado:{}, existe:{}, dirty:{}, escribiendo:{}, otraVez:{}, timers:{}, ultimo:{}, error:null, ultimaSync:0, sample:null, downloads:null };
function estadoSync(){
  let s = 'ok', txt = 'Sincronizado';
  if(SY.modo === 'cargando'){ s = 'guardando'; txt = 'Conectando…'; }
  else if(SY.modo === 'local'){ s = 'local'; txt = 'Solo en este navegador'; }
  else if(SY.error){ s = 'error'; txt = 'Sin conexión · reintenta al editar'; }
  else if(DOCS.some(d => SY.dirty[d] || SY.escribiendo[d])){ s = 'guardando'; txt = 'Guardando en la nube…'; }
  else if(SY.ultimaSync){ txt = 'Guardado en la nube ' + new Date(SY.ultimaSync).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', hourCycle:'h23'}); }
  document.querySelectorAll('.sync').forEach(el => { el.dataset.s = s; const t = el.querySelector('.txt'); if(t) t.textContent = txt; el.title = txt; });
}
function marcar(doc){
  SY.dirty[doc] = true; estadoSync();
  clearTimeout(SY.timers[doc]);
  SY.timers[doc] = setTimeout(() => escribir(doc), 650);
}
async function escribir(doc){
  if(SY.escribiendo[doc]){ SY.otraVez[doc] = true; return; }
  SY.escribiendo[doc] = true; SY.dirty[doc] = false; estadoSync();
  const cuerpo = clon(S[doc]);
  const txt = JSON.stringify(cuerpo);
  let ok = false;
  for(let intento = 0; intento < 2 && !ok; intento++){
    try {
      if(SY.db) await SY.db.doc(`${SY.base}/${doc}`).set(cuerpo);
      else if(!lsSet('bnz.local.' + doc, txt)) throw {code:'local', message:'El navegador no permite guardar'};
      ok = true; SY.ultimo[doc] = txt; SY.existe[doc] = true; SY.error = null; SY.ultimaSync = Date.now();
    } catch(e){
      SY.error = e;
      if(e && e.code === 'unavailable' && intento === 0){ await new Promise(r => setTimeout(r, 900 + Math.random()*900)); continue; }
      if(e && e.code === 'quota_exceeded') toast('La nube está llena: borrá movimientos o copias viejas.', 'err');
      else if(e && e.code === 'invalid_argument') toast('No se pudo guardar: los datos son demasiado grandes.', 'err');
      SY.dirty[doc] = true;
      break;
    }
  }
  SY.escribiendo[doc] = false;
  if(ok && (SY.otraVez[doc] || SY.dirty[doc])){ SY.otraVez[doc] = false; setTimeout(() => escribir(doc), 300); }
  estadoSync();
}
function aplicarRemoto(doc, data){
  const txt = JSON.stringify(data ?? null);
  if(txt === SY.ultimo[doc]) return false;
  SY.ultimo[doc] = txt;
  S[doc] = normalizarDoc(doc, data ? JSON.parse(txt) : null);
  return true;
}
let renderPend = false;
function programarRender(){ if(renderPend) return; renderPend = true; requestAnimationFrame(() => { renderPend = false; render(false); }); }

async function conectar(){
  const C = window.claude;
  let db = null, user = null;
  try { if(C && C.use){ [db, user] = await Promise.all([C.use('db'), C.use('user')]); } } catch(e){}
  let id = null;
  try { id = user ? await user.id() : null; } catch(e){}
  if(C && C.use){ C.use('sample').then(s => { SY.sample = s; if(S && UI.vista === 'ia') render(false); }).catch(() => {}); C.use('downloads').then(d => { SY.downloads = d; }).catch(() => {}); }
  if(db && id){
    SY.db = db; SY.base = 'data/users/' + id; SY.modo = 'nube';
    const t0 = setTimeout(() => { if(DOCS.some(d => !SY.confirmado[d])){ UI.avisoConexion = true; programarRender(); } }, 10000);
    DOCS.forEach(doc => {
      db.doc(`${SY.base}/${doc}`).onSnapshot(snap => {
        SY.listo[doc] = true;
        if(!snap.metadata.fromCache){ SY.confirmado[doc] = true; if(DOCS.every(d => SY.confirmado[d])){ clearTimeout(t0); if(UI.avisoConexion){ UI.avisoConexion = false; programarRender(); } respaldoDiario(); } }
        SY.existe[doc] = snap.exists;
        let cambio = false;
        if(!(snap.metadata.hasPendingWrites || SY.dirty[doc] || SY.escribiendo[doc])) cambio = aplicarRemoto(doc, snap.exists ? snap.data() : null);
        if(UI.cargando){ if(DOCS.every(d => SY.listo[d])){ UI.cargando = false; ocultarSplash(); pintarShell(); render(true); } return; }
        if(cambio) programarRender();
      }, err => { SY.error = err; estadoSync(); if(UI.cargando){ UI.cargando = false; ocultarSplash(); programarRender(); } });
    });
  } else {
    SY.modo = 'local';
    DOCS.forEach(doc => { try { const raw = lsGet('bnz.local.' + doc); if(raw){ S[doc] = normalizarDoc(doc, JSON.parse(raw)); SY.ultimo[doc] = raw; SY.existe[doc] = true; } } catch(e){} });
    UI.cargando = false; ocultarSplash(); render(true);
  }
  estadoSync();
}

/* Copia diaria en la nube (una por día, se guardan las últimas 14) */
async function respaldoDiario(){
  if(!SY.db || UI.respaldoHecho) return;
  UI.respaldoHecho = true;
  const hoy = hoyISO();
  if(!['tareas','eventos','eco','pres'].some(d => SY.existe[d])) return;
  if(S.perfil.ultimoRespaldo === hoy) return;
  try {
    const datos = {perfil:S.perfil, tareas:S.tareas, eventos:S.eventos, eco:S.eco, pres:S.pres};
    if(JSON.stringify(datos).length > 240000) return;
    const col = SY.db.doc(`${SY.base}/perfil`).collection('respaldos');
    await col.doc(hoy).set({fecha:hoy, creado:new Date().toISOString(), datos:clon(datos)});
    S.perfil.ultimoRespaldo = hoy; marcar('perfil');
    const lista = await col.get();
    const ids = lista.docs.map(d => d.id).sort();
    for(const viejo of ids.slice(0, Math.max(0, ids.length - 14))) await col.doc(viejo).delete();
  } catch(e){ console.warn('respaldo', e); }
}

/* ---------------- Cálculos ---------------- */
const suma = (arr, k='monto') => arr.reduce((a, x) => a + (Number(x[k])||0), 0);
const area = id => (S.perfil.areas.find(a => a.id === id) || {nombre:'Sin área'});
const tareaHecha = t => t.diaria ? t.hechaEn === hoyISO() : !!t.hecha;
const tareaVencida = t => !tareaHecha(t) && t.fecha && t.fecha < hoyISO();
const PRIO = {alta:0, media:1, baja:2};
function ordenarTareas(a, b){
  const ha = tareaHecha(a), hb = tareaHecha(b);
  if(ha !== hb) return ha ? 1 : -1;
  if((PRIO[a.prioridad]??1) !== (PRIO[b.prioridad]??1)) return (PRIO[a.prioridad]??1) - (PRIO[b.prioridad]??1);
  if(a.fecha && b.fecha) return a.fecha.localeCompare(b.fecha);
  return a.fecha ? -1 : b.fecha ? 1 : 0;
}
function resumenEco(){
  const e = S.eco;
  const ing = suma(e.ingresos), gas = suma(e.gastos), ser = suma(e.servicios);
  const egresos = gas + ser, balance = ing - egresos, pct = ing ? balance / ing : 0;
  const anio = String(new Date().getFullYear());
  const ahorro = (e.ahorro[anio] || []).reduce((a, n) => a + (Number(n)||0), 0);
  return {ing, gas, ser, egresos, balance, pct, ahorro, anio};
}
function movMes(ym){
  const l = S.eco.movimientos.filter(m => (m.fecha||'').startsWith(ym)).sort((a,b) => b.fecha.localeCompare(a.fecha));
  const ing = suma(l.filter(m => m.tipo === 'ingreso')), gas = suma(l.filter(m => m.tipo === 'gasto'));
  return {l, ing, gas, neto: ing - gas};
}
function agendaEntre(desde, hasta){
  const out = [];
  EVENTOS().forEach(ev => {
    if(!isoValido(ev.fecha)) return;
    if(ev.repite === 'semanal'){
      let f = ev.fecha;
      if(f < desde){ const dif = Math.round((deISO(desde) - deISO(f)) / 864e5); f = sumarDias(f, Math.ceil(dif/7)*7); }
      for(; f <= hasta; f = sumarDias(f, 7)) out.push({tipo:'ev', fecha:f, ev});
    } else if(ev.fecha >= desde && ev.fecha <= hasta) out.push({tipo:'ev', fecha:ev.fecha, ev});
  });
  TAREAS().forEach(t => { if(isoValido(t.fecha) && !tareaHecha(t) && t.fecha >= desde && t.fecha <= hasta) out.push({tipo:'tarea', fecha:t.fecha, t}); });
  return out.sort((a,b) => (a.fecha + (a.ev?.hora||'99')).localeCompare(b.fecha + (b.ev?.hora||'99')));
}

/* ---------------- Recordatorios: calendario y WhatsApp ---------------- */
function linkCalendario(titulo, fecha, hora, nota){
  const f = fecha.replace(/-/g, '');
  let dates;
  if(hora && /^\d{2}:\d{2}$/.test(hora)){
    const [h, m] = hora.split(':').map(Number);
    const fin = new Date(+fecha.slice(0,4), +fecha.slice(5,7)-1, +fecha.slice(8,10), h + 1, m);
    dates = `${f}T${pad(h)}${pad(m)}00/${isoDe(fin).replace(/-/g,'')}T${pad(fin.getHours())}${pad(fin.getMinutes())}00`;
  } else dates = `${f}/${sumarDias(fecha, 1).replace(/-/g, '')}`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&dates=${dates}&ctz=America/Argentina/Buenos_Aires&details=${encodeURIComponent((nota ? nota + '\n\n' : '') + 'Recordatorio de Design | BNZ')}`;
}
function linkWA(msg){ const n = String(S.perfil.whatsapp || '').replace(/\D/g, ''); return `https://wa.me/${n}?text=${encodeURIComponent(msg)}`; }
function msgRecordatorio(titulo, fecha, hora, nota){ return `⏰ Recordatorio: ${titulo}\n📅 ${cap(fDia(fecha))}${hora ? ' · ' + hora + ' h' : ''}${nota ? '\n📝 ' + nota : ''}`; }
function linksRecordar(titulo, fecha, hora, nota){
  if(!isoValido(fecha)) return '';
  return `<a class="mini-link" href="${esc(linkCalendario(titulo, fecha, hora, nota))}" target="_blank" rel="noopener" title="Crear recordatorio en Google Calendar">+ Calendario</a>
    <a class="mini-link wa" href="${esc(linkWA(msgRecordatorio(titulo, fecha, hora, nota)))}" target="_blank" rel="noopener" title="Mandarlo por WhatsApp">WhatsApp</a>`;
}
function msgResumenDia(){
  const hoy = hoyISO();
  const ag = agendaEntre(hoy, sumarDias(hoy, 1));
  const foco = TAREAS().filter(t => !tareaHecha(t) && (t.plazo === 'hoy' || t.diaria || t.fecha === hoy || tareaVencida(t) || t.prioridad === 'alta')).sort(ordenarTareas).slice(0, 8);
  let m = `📋 *Design | BNZ · ${cap(fDia(hoy))}*\n`;
  if(ag.length){ m += `\n*Agenda*\n` + ag.map(x => `• ${x.fecha === hoy ? 'Hoy' : 'Mañana'}${x.ev?.hora ? ' ' + x.ev.hora : ''}: ${x.ev ? x.ev.titulo : x.t.titulo}`).join('\n') + '\n'; }
  if(foco.length){ m += `\n*Tareas en foco*\n` + foco.map(t => `• ${t.titulo}${tareaVencida(t) ? ' (vencida)' : ''}`).join('\n') + '\n'; }
  if(!ag.length && !foco.length) m += '\nNada urgente por hoy. 🙌';
  return m;
}

function render(animar){

  let s0 = null, s1 = null; try { if(fid){ s0 = act.selectionStart; s1 = act.selectionEnd; } } catch(e){}

  main.innerHTML = `<div class="wrap ${animar ? 'entrar' : ''}">${UI.cargando ? vistaCargando() : VISTA_HTML[UI.vista]()}</div>`;

function vivos(){

  tmp.innerHTML = VISTA_HTML[UI.vista]();
  tmp.querySelectorAll('[data-live]').forEach(n => { document.querySelectorAll(`#main [data-live="${n.dataset.live}"]`).forEach(o => { if(o.innerHTML !== n.innerHTML) o.innerHTML = n.innerHTML; }); });

function contadores(){ const pend = TAREAS().filter(t => !tareaHecha(t)).length; document.querySelectorAll('[data-live="cnt-tareas"]').forEach(el => el.textContent = pend || ''); }
function animarCifras(){
  document.querySelectorAll('#main [data-cuenta]').forEach(el => {
    const fin = Number(el.dataset.cuenta), fmt = el.dataset.fmt;
    if(!isFinite(fin) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const t0 = performance.now(), dur = 700;
    const paso = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3), v = fin * e; el.textContent = fmt === 'plata' ? plata(v) : Math.round(v); if(k < 1 && el.isConnected) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
}
function ir(v){
  if(!VISTAS.some(x => x.id === v)) v = 'inicio';
  UI.vista = v;
  if(location.hash.slice(1) !== v){ try { history.replaceState(null, '', '#' + v); } catch(e){} }
  render(true); window.scrollTo({top:0, behavior:'instant'});
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(VISTAS.some(v => v.id === h) && h !== UI.vista){ UI.vista = h; render(true); } });

function toast(msg, tipo){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;

economia(){

  <section class="panel">

          <td class="r"><button class="btn btn-ghost danger btn-sm" data-act="borrar" data-col="mov" data-id="${m.id}" aria-label="Borrar">✕</button></td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="3">Ingresos ${plata(mm.ing)} · Gastos ${plata(mm.gas)}</td><td class="r monto ${mm.neto >= 0 ? 'pos' : 'neg'}">${mm.neto >= 0 ? '+' : '−'} ${plata(Math.abs(mm.neto))}</td><td></td></tr></tfoot></table>`

          <button class="btn btn-ghost danger btn-sm" data-act="borrar" data-col="metas" data-id="${m.id}" aria-label="Borrar">✕</button>

    </section>
    <section class="panel">

          <input class="inp" id="f-compras-${m.id}-nombre" data-col="compras" data-id="${m.id}" data-f="nombre" value="${esc(m.nombre)}" aria-label="Artículo">

          <button class="btn btn-ghost danger btn-sm" data-act="borrar" data-col="compras" data-id="${m.id}" aria-label="Borrar">✕</button>
        </div>`).join('') || '<div class="vacio">Vacío</div>'}</div>

cronograma(){
  const [y, m] = UI.calMes.split('-').map(Number);
  const offset = (new Date(y, m-1, 1).getDay() + 6) % 7;
  const inicio = isoDe(new Date(y, m-1, 1 - offset));
  const fin = sumarDias(inicio, 41);
  const porDia = {}; agendaEntre(inicio, fin).forEach(x => (porDia[x.fecha] = porDia[x.fecha] || []).push(x));
  const hoy = hoyISO();
  const ed = UI.evEditar ? EVENTOS().find(e => e.id === UI.evEditar) : null;
  const f = ed || {titulo:'', fecha:UI.calSel, hora:'', area:'prof', repite:'', nota:''};
  const delDia = agendaEntre(UI.calSel, UI.calSel);
  const prox = agendaEntre(hoy, sumarDias(hoy, 45)).slice(0, 12);
  let grid = DOW.map(d => `<div class="dow">${d}</div>`).join('');
  for(let i = 0; i < 42; i++){
    const iso = sumarDias(inicio, i), d = deISO(iso), items = porDia[iso] || [];
    grid += `<button class="dia ${d.getMonth() !== m-1 ? 'fuera' : ''} ${iso === hoy ? 'hoy' : ''} ${iso === UI.calSel ? 'sel' : ''}" data-act="cal-dia" data-f="${iso}" aria-label="${fDia(iso)}${items.length ? `, ${items.length} actividades` : ''}">
      <span class="d">${d.getDate()}</span>
      ${items.slice(0,3).map(x => `<span class="ev ${x.tipo === 'tarea' ? 'tk' : ''}">${x.ev && x.ev.hora ? x.ev.hora + ' ' : ''}${esc(x.ev ? x.ev.titulo : x.t.titulo)}</span>`).join('')}
      ${items.length > 3 ? `<span class="ev mas">+${items.length - 3} más</span>` : ''}</button>`;
  }
  return `
  <div class="cab"><div><div class="eyebrow">Cronograma</div><h1>Actividades y fechas</h1>
    <p>Eventos, entregas, clases y rutinas semanales. Cada uno tiene botones para crear el recordatorio en tu calendario o mandártelo por WhatsApp.</p></div>
    <button class="btn" data-nav-btn="ia">${ICON.ia} Agendar con IA</button></div>
  <section class="panel">
    <div class="panel-h"><h2>${ed ? 'Editar actividad' : 'Nueva actividad'}</h2>${ed ? '<button class="btn btn-sm" data-act="ev-cancelar">Cancelar edición</button>' : ''}</div>
    <form id="f-evento" class="form-fila form-evento" autocomplete="off">
      <div class="campo ancho"><label class="lbl" for="e-titulo">Actividad</label><input class="inp" id="e-titulo" required placeholder="Ej: Entrega de planos Morumbí" value="${esc(f.titulo)}"></div>
      <div class="campo"><label class="lbl" for="e-fecha">Fecha</label><input class="inp" type="date" id="e-fecha" required value="${esc(f.fecha)}"></div>
      <div class="campo"><label class="lbl" for="e-hora">Hora</label><input class="inp" type="time" id="e-hora" value="${esc(f.hora)}"></div>
      <div class="campo"><label class="lbl" for="e-area">Área</label><select class="inp" id="e-area">${optAreas(f.area)}</select></div>
      <div class="campo"><label class="lbl" for="e-repite">Repetir</label><select class="inp" id="e-repite"><option value="">No se repite</option><option value="semanal" ${f.repite === 'semanal' ? 'selected' : ''}>Cada semana</option></select></div>
      <button class="btn btn-primary" type="submit">${ed ? 'Guardar' : 'Agregar'}</button>
    </form>
    <div class="extra"><input class="inp" id="e-nota" placeholder="Nota (opcional)" value="${esc(f.nota)}" aria-label="Nota"></div>
  </section>
  <div class="cron">
    <section class="panel" style="padding:14px">
      <div class="panel-h">
        <div class="cal-nav"><button class="btn btn-sm" data-act="cal-mes" data-d="-1" aria-label="Mes anterior">‹</button><h2>${MESES[m-1]} ${y}</h2><button class="btn btn-sm" data-act="cal-mes" data-d="1" aria-label="Mes siguiente">›</button></div>
        <button class="btn btn-sm" data-act="cal-hoy">Hoy</button>
      </div>
      <div class="cal">${grid}</div>
    </section>
    <div style="display:grid;gap:18px;align-content:start">
      <section class="panel"><div class="panel-h"><h2>${cap(fDia(UI.calSel))}</h2></div>
        ${delDia.length ? `<ul class="agenda">${delDia.map(x => htmlAgenda(x, x.fecha < hoy, true)).join('')}</ul>` : '<div class="vacio">Nada este día.</div>'}</section>
      <section class="panel"><div class="panel-h"><h2>Próximas</h2><span class="sub">45 días</span></div>
        ${prox.length ? `<ul class="agenda">${prox.map(x => htmlAgenda(x, false, true)).join('')}</ul>` : '<div class="vacio">No hay actividades próximas cargadas.</div>'}</section>
    </div>
  </div>`;
},

/* Gráfico de barras de la caja de ahorro (una serie: el título la nombra) */
function graficoAhorro(vals){
  const W = 640, H = 210, L = 64, R = 8, T = 20, B = 26;
  const max = Math.max(...vals.map(v => Number(v)||0), 0);
  const paso = (() => { if(max <= 0) return 100000; const raw = max / 3; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; })();
  const top = Math.max(paso * Math.ceil((max || 1) / paso), paso);
  const y = v => T + (H - T - B) * (1 - v / top);
  const cw = (W - L - R) / 12, bw = Math.min(26, cw * 0.56);
  let s = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ahorro por mes ${UI.anioAhorro}">`;
  for(let v = 0; v <= top + 1; v += paso) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000000 ? (v/1000000).toLocaleString('es-AR') + ' M' : v >= 1000 ? Math.round(v/1000) + ' k' : v}</text>`;
  const maxIdx = vals.reduce((bi, v, i) => (Number(v)||0) > (Number(vals[bi])||0) ? i : bi, 0);
  vals.forEach((raw, i) => {
    const v = Number(raw)||0, cx = L + cw * i + cw / 2, x = cx - bw / 2, yy = y(v), h = (H - B) - yy;
    s += `<g class="col" data-tip="${MESES[i]}: ${plata(v)}"><rect class="hit" x="${L + cw * i}" y="${T}" width="${cw}" height="${H - T - B}"/>`;
    if(v > 0){ const r = Math.min(4, h/2); s += `<path class="bar" style="animation-delay:${i * 0.03}s" d="M${x},${H - B} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${H - B} Z"/>`; }
    if(v > 0 && i === maxIdx) s += `<text class="val" x="${cx}" y="${yy - 6}" text-anchor="middle">${plata(v)}</text>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${MES_C[i]}</text></g>`;
  });
  return s + `</svg>`;
}
function enlazarGrafico(){
  const tip = $('#tip');
  document.querySelectorAll('.graf g.col').forEach(g => {
    g.onpointerenter = g.onpointermove = e => { tip.hidden = false; tip.textContent = g.dataset.tip; tip.style.left = Math.min(e.clientX + 12, innerWidth - 170) + 'px'; tip.style.top = (e.clientY - 36) + 'px'; };
    g.onpointerleave = () => { tip.hidden = true; };
  });
}

function limpiarRes(r){

const tenc = new TextEncoder(), tdec = new TextDecoder();
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrirBovedaVieja(pass){
  const raw = JSON.parse(lsGet('bnz.boveda.v1'));
  const base = await crypto.subtle.importKey('raw', tenc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(raw.salt), iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(raw.iv)}, key, unb64(raw.ct));
  return JSON.parse(tdec.decode(pt));
}

    <div style="display:flex;justify-content:space-between;align-items:center"><h2 id="mg-t">Traer datos de la versión anterior</h2><button class="btn btn-ghost" data-act="modal-cerrar" aria-label="Cerrar">✕</button></div>
    <p>Ingresá la contraseña que usabas en la versión anterior. Se usa una sola vez para abrir esos datos y pasarlos a la nube. Van a reemplazar lo que hay ahora.</p>
    <form id="f-migrar" class="fila-acc"><input class="inp" type="password" id="mg-clave" placeholder="Contraseña anterior" style="flex:1;min-width:200px" autocomplete="off"><button class="btn btn-primary" type="submit">Traer datos</button></form>
    <span class="msg" id="mg-msg"></span>
  </div></div>`;
  $('#mg-clave').focus();
}
async function migrar(pass){
  const msg = $('#mg-msg');
  try {
    if(!window.crypto || !crypto.subtle) throw new Error('cripto');
    const d = await abrirBovedaVieja(pass);
    importarDatos(d);
    S.perfil.migrado = true; marcar('perfil');
    cerrarModal(); toast('Datos de la versión anterior traídos'); render(true);
  } catch(e){ if(msg){ msg.textContent = e && e.message === 'formato' ? 'Los datos viejos no tienen el formato esperado.' : 'Contraseña incorrecta.'; msg.className = 'msg err'; } }
}

/* ---------------- PDF del presupuesto ---------------- */
const H2P = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
async function presPDF(btn){
  const dl = SY.downloads;
  const b = S.pres.borrador;
  const nombre = `Presupuesto ${b.numero}${b.cliente ? ' - ' + b.cliente.replace(/[\\/:*?"<>|]/g, '') : ''}.pdf`;
  if(btn){ btn.disabled = true; btn.textContent = 'Generando PDF…'; }
  let cont = null;
  try {
    if(!window.html2pdf) await cargarScript(H2P);
    cont = document.createElement('div');
    cont.style.cssText = 'position:fixed;left:0;top:0;z-index:-1;pointer-events:none;width:210mm';
    cont.innerHTML = htmlHoja();
    document.body.appendChild(cont);
    const el = cont.firstElementChild;
    el.removeAttribute('id'); el.style.width = '210mm'; el.style.minHeight = '0'; el.style.boxShadow = 'none';
    const blob = await window.html2pdf().set({margin:0, image:{type:'jpeg', quality:0.97}, html2canvas:{scale:2, backgroundColor:'#ffffff', scrollX:0, scrollY:0}, jsPDF:{unit:'mm', format:'a4', orientation:'portrait'}, pagebreak:{mode:['avoid-all']}}).from(el).outputPdf('blob');
    if(dl) await dl.save({filename:nombre, data:blob});
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); }
    toast('PDF listo');
  } catch(e){
    if(!(e && e.code === 'declined')) toast('No se pudo generar el PDF en esta vista.', 'err');
  } finally {
    if(cont) cont.remove();
    if(btn){ btn.disabled = false; btn.textContent = 'Descargar PDF'; }
  }
}

/* ---------------- Ajustes ---------------- */
async function abrirAjustes(){
  const P = S.perfil, tema = lsGet('bnz.tema') || 'sistema';
  $('#modal-root').innerHTML = `<div class="modal" data-act="modal-fondo"><div class="modal-c" role="dialog" aria-modal="true" aria-labelledby="aj-t">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 id="aj-t">Ajustes y copias</h2><button class="btn btn-ghost" data-act="modal-cerrar" aria-label="Cerrar">✕</button></div>
    <section><h3>Guardado</h3>
      <p>${SY.modo === 'nube' ? 'Cada cambio se guarda solo en la nube al instante y se actualiza en vivo en tu PC y tu celular. Además se hace una copia completa por día (se guardan las últimas 14).' : 'Modo sin nube: se guarda solo en este navegador. Completá config.js para sincronizar (README, paso 2).'}</p>
      <span class="sync" data-s="ok" style="color:var(--fg-2)"><i></i><span class="txt"></span></span>
      ${window.BNZ_SALIR ? '<div class="fila-acc"><button class="btn btn-sm" data-act="salir">Cerrar sesión en este dispositivo</button></div>' : ''}
    </section>
    <section><h3>Copia en tu computadora</h3>
      <p>${P.ultimaCopiaPC ? `Última copia guardada: ${fLarga(P.ultimaCopiaPC)}.` : 'Todavía no guardaste ninguna.'} Es un archivo .json con todo; guardalo en una carpeta tuya o en Drive.</p>
      <div class="fila-acc"><button class="btn btn-primary" data-act="exportar">Guardar copia en la PC</button>
        <label class="btn" for="aj-importar" style="cursor:pointer">Restaurar desde archivo</label><input type="file" id="aj-importar" accept=".json,application/json" hidden>
        <span class="msg" id="aj-msg-bk"></span></div>
    </section>
    <section><h3>Copias en la nube</h3><div class="respaldos" id="aj-respaldos">${SY.db ? '<div class="skel" style="height:34px"></div>' : '<p>No disponible en esta vista.</p>'}</div></section>
    <section><h3>Perfil</h3>
      <div class="dos"><div class="campo"><label class="lbl" for="aj-nombre">Nombre</label><input class="inp" id="aj-nombre" data-perfil="nombre" value="${esc(P.nombre)}"></div>
      <div class="campo"><label class="lbl" for="aj-wa">WhatsApp (549…)</label><input class="inp" id="aj-wa" data-perfil="whatsapp" inputmode="tel" value="${esc(P.whatsapp)}"></div></div>
    </section>
    <section><h3>Tema</h3>
      <div class="seg" role="group" aria-label="Tema">${[['sistema','Según el sistema'],['light','Claro (papel)'],['dark','Oscuro (tinta)']].map(([v,n]) => `<button data-act="tema" data-v="${v}" aria-pressed="${tema === v}">${n}</button>`).join('')}</div>
    </section>
  </div></div>`;
  estadoSync();
  if(SY.db){
    try {
      const snap = await SY.db.doc(`${SY.base}/perfil`).collection('respaldos').get();
      const box = $('#aj-respaldos'); if(!box) return;
      const docs = snap.docs.filter(d => d.exists).sort((a, b) => b.id.localeCompare(a.id));
      box.innerHTML = docs.length ? docs.map(d => { const v = d.data(); const n = v.datos && v.datos.tareas ? (v.datos.tareas.items || []).length : 0; return `<div><span><b class="mono">${fLarga(d.id)}</b> · ${n} tareas</span><button class="btn btn-sm" data-act="restaurar" data-id="${d.id}">Restaurar</button></div>`; }).join('') : '<p>La primera copia diaria se crea sola hoy.</p>';
    } catch(e){ const box = $('#aj-respaldos'); if(box) box.innerHTML = '<p>No se pudieron leer las copias ahora.</p>'; }
  }
}
function cerrarModal(){ $('#modal-root').innerHTML = ''; }
function aplicarTema(v){ if(v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme'); }
aplicarTema(lsGet('bnz.tema'));

/* ---------------- Eventos ---------------- */
const COL = {
  tareas: [() => TAREAS(), 'tareas'], eventos: [() => EVENTOS(), 'eventos'], mov: [() => S.eco.movimientos, 'eco'],
  ingresos: [() => S.eco.ingresos, 'eco'], gastos: [() => S.eco.gastos, 'eco'], servicios: [() => S.eco.servicios, 'eco'],
  metas: [() => S.eco.metas, 'eco'], compras: [() => S.eco.compras, 'eco'], items: [() => S.pres.borrador.items, 'pres'], hist: [() => S.pres.historial, 'pres']
};
function quitar(col, id){ const [get, doc] = COL[col]; const arr = get(); const i = arr.findIndex(x => x.id === id); if(i >= 0){ arr.splice(i, 1); marcar(doc); } }

document.addEventListener('click', async e => {
  const nb = e.target.closest('[data-nav-btn]'); if(nb){ ir(nb.dataset.navBtn); return; }
  const na = e.target.closest('a[data-nav]'); if(na){ e.preventDefault(); ir(na.dataset.nav); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act === 'modal-fondo' && e.target !== el) return;
  switch(act){
    case 'ajustes': abrirAjustes(); return;
    case 'salir': if(window.BNZ_SALIR) window.BNZ_SALIR(); return;
    case 'modal-cerrar': case 'modal-fondo': cerrarModal(); return;
    case 'tema': lsSet('bnz.tema', el.dataset.v); aplicarTema(el.dataset.v); abrirAjustes(); return;
    case 'exportar': guardarCopiaPC(); return;
    case 'migrar': abrirMigracion(); return;
    case 'migrar-no': lsSet('bnz.migracion.ignorada', '1'); render(false); return;
    case 'restaurar': {
      if(el.dataset.confirm !== '1'){ el.dataset.confirm = '1'; el.textContent = '¿Reemplazar todo?'; el.classList.add('btn-accent'); return; }
      try { const d = await SY.db.doc(`${SY.base}/perfil/respaldos/${id}`).get(); if(d.exists){ importarDatos(clon(d.data().datos)); cerrarModal(); toast('Copia del ' + fLarga(id) + ' restaurada'); render(true); } }
      catch(ex){ toast('No se pudo restaurar esa copia.', 'err'); }
      return;
    }
    case 'borrar':
      if(el.dataset.confirm !== '1'){ el.dataset.confirm = '1'; el.dataset.txt = el.textContent; el.textContent = '¿Seguro?'; setTimeout(() => { if(el.isConnected){ el.dataset.confirm = ''; el.textContent = el.dataset.txt; } }, 3000); return; }
      { const li = el.closest('.tarea, .ed-fila, tr, li'); if(li) li.classList.add('saliendo'); }
      setTimeout(() => { quitar(el.dataset.col, id); if(el.dataset.col === 'tareas' && UI.tEditar === id) UI.tEditar = null; if(el.dataset.col === 'eventos' && UI.evEditar === id) UI.evEditar = null; render(false); }, 160);
      return;
    case 'tarea-toggle': {
      const t = TAREAS().find(x => x.id === id); if(!t) return;
      if(t.diaria) t.hechaEn = t.hechaEn === hoyISO() ? '' : hoyISO(); else { t.hecha = !t.hecha; t.hechaFecha = t.hecha ? hoyISO() : ''; }
      marcar('tareas');
      el.classList.add('pop'); el.closest('.tarea')?.classList.toggle('hecha', tareaHecha(t));
      if(tareaHecha(t)) toast('¡Hecha! ' + (TAREAS().filter(x => !tareaHecha(x)).length) + ' pendientes');
      setTimeout(() => render(false), 420); return;
    }
    case 'tarea-editar': UI.tEditar = id; render(false); $('#t-titulo').focus(); window.scrollTo({top:0, behavior:'smooth'}); return;
    case 'tarea-cancelar': UI.tEditar = null; render(false); return;
    case 't-plazo': UI.tPlazo = el.dataset.v; render(false); return;
    case 'mov-mes': { const [y,m] = UI.mesMov.split('-').map(Number); const d = new Date(y, m - 1 + Number(el.dataset.d), 1); UI.mesMov = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(false); return; }
    case 'ahorro-anio': UI.anioAhorro = String(Number(UI.anioAhorro) + Number(el.dataset.d)); render(false); return;
    case 'eco-add': {
      const col = el.dataset.col, nuevo = {id:uid(), nombre:'', monto:0};
      if(col === 'metas'){ nuevo.tipo = 'meta'; nuevo.hecha = false; } if(col === 'compras') nuevo.hecha = false;
      S.eco[col].push(nuevo); marcar('eco'); render(false); const f = document.getElementById(`f-${col}-${nuevo.id}-nombre`); if(f) f.focus(); return;
    }
    case 'eco-check': { const x = COL[el.dataset.col][0]().find(z => z.id === id); if(x){ x.hecha = el.checked; marcar('eco'); render(false); } return; }
    case 'cal-mes': { const [y,m] = UI.calMes.split('-').map(Number); const d = new Date(y, m - 1 + Number(el.dataset.d), 1); UI.calMes = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(false); return; }
    case 'cal-hoy': UI.calMes = hoyISO().slice(0,7); UI.calSel = hoyISO(); render(false); return;
    case 'cal-dia': UI.calSel = el.dataset.f; render(false); return;
    case 'ev-editar': UI.evEditar = id; render(false); $('#e-titulo').focus(); window.scrollTo({top:0, behavior:'smooth'}); return;
    case 'ev-cancelar': UI.evEditar = null; render(false); return;
    case 'item-add': { const n = {id:uid(), cant:1, desc:'', precio:0}; S.pres.borrador.items.push(n); marcar('pres'); render(false); const f = document.getElementById(`f-items-${n.id}-desc`); if(f) f.focus(); return; }
    case 'pres-nuevo': {
      const max = S.pres.historial.reduce((a, h) => Math.max(a, parseInt(h.numero, 10) || 0), 0);
      S.pres.seq = Math.max(S.pres.seq || 1, max + 1);
      S.pres.borrador = presNuevo(S.pres.seq); marcar('pres'); render(false); $('#b-cliente').focus(); return;
    }
    case 'pres-guardar': {
      const b = S.pres.borrador;
      const total = b.items.reduce((a, i) => a + (Number(i.cant)||0) * (Number(i.precio)||0), 0);
      const copia = clon(b);
      const ex = S.pres.historial.find(h => h.id === b.id);
      if(ex) Object.assign(ex, copia, {total, estado:ex.estado, cobroRegistrado:ex.cobroRegistrado});
      else S.pres.historial.push({...copia, total, estado:'borrador', cobroRegistrado:false});
      const n = parseInt(b.numero, 10) || 0; if(n >= (S.pres.seq || 1)) S.pres.seq = n + 1;
      marcar('pres'); toast(ex ? 'Presupuesto actualizado' : 'Presupuesto guardado en el historial'); render(false); return;
    }
    case 'pres-pdf': presPDF(el); return;
    case 'hist-abrir': { const h = S.pres.historial.find(x => x.id === id); if(h){ const c = clon(h); delete c.total; delete c.estado; delete c.cobroRegistrado; S.pres.borrador = c; marcar('pres'); render(false); window.scrollTo({top:0, behavior:'smooth'}); } return; }
    case 'hist-cobro': {
      const h = S.pres.historial.find(x => x.id === id); if(!h || h.cobroRegistrado) return;
      S.eco.movimientos.push({id:uid(), fecha:hoyISO(), desc:`Presupuesto ${h.numero} · ${h.cliente || 'cliente'}`, tipo:'ingreso', cat:'Trabajo', monto:h.total});
      h.cobroRegistrado = true; marcar('eco'); marcar('pres'); toast('Ingreso registrado en Economía'); render(false); return;
    }
    case 'ia-modo': UI.iaModo = el.dataset.v; render(false); return;
    case 'ia-ej': UI.iaTexto = el.dataset.t; render(false); $('#ia-txt').focus(); return;
    case 'ia-limpiar': UI.iaTexto = ''; UI.iaImgs.forEach(x => URL.revokeObjectURL(x.url)); UI.iaImgs = []; UI.iaRes = null; UI.iaError = ''; render(false); return;
    case 'ia-quitar-img': { const i = Number(el.dataset.i); const x = UI.iaImgs.splice(i, 1)[0]; if(x) URL.revokeObjectURL(x.url); vivos(); return; }
    case 'ia-ordenar': iaOrdenar(); return;
    case 'ia-aplicar': iaAplicar(); return;
    case 'chat-limpiar': S.ia.chat = []; marcar('ia'); render(false); return;
  }
});

document.addEventListener('submit', e => {
  const id = e.target.id;
  if(id === 'f-hero-ia'){ e.preventDefault(); const t = $('#hero-ia-txt').value.trim(); if(!t){ $('#hero-ia-txt').focus(); return; } UI.heroTexto = ''; UI.iaTexto = t; UI.iaModo = 'ordenar'; ir('ia'); iaOrdenar(); return; }
  if(id === 'f-chat'){ e.preventDefault(); iaPreguntar(); return; }
  if(id === 'f-migrar'){ e.preventDefault(); migrar($('#mg-clave').value); return; }
  if(id === 'f-tarea'){
    e.preventDefault();
    const titulo = $('#t-titulo').value.trim(); if(!titulo){ $('#t-titulo').focus(); return; }
    const datos = {titulo, area:$('#t-area').value, plazo:$('#t-plazo').value, fecha:$('#t-fecha').value, prioridad:$('#t-prio').value, nota:$('#t-nota').value.trim(), diaria:$('#t-diaria').checked};
    if(datos.diaria) datos.plazo = 'hoy';
    if(UI.tEditar){ const t = TAREAS().find(x => x.id === UI.tEditar); if(t) Object.assign(t, datos); UI.tEditar = null; toast('Tarea actualizada'); }
    else { TAREAS().push({id:uid(), ...datos, hecha:false, hechaEn:'', creada:hoyISO()}); toast('Tarea agregada'); }
    marcar('tareas'); render(false); const f = $('#t-titulo'); if(f) f.focus();
  }
  if(id === 'f-evento'){
    e.preventDefault();
    const titulo = $('#e-titulo').value.trim(), fecha = $('#e-fecha').value; if(!titulo || !fecha) return;
    const datos = {titulo, fecha, hora:$('#e-hora').value, area:$('#e-area').value, repite:$('#e-repite').value, nota:$('#e-nota').value.trim()};
    if(UI.evEditar){ const ev = EVENTOS().find(x => x.id === UI.evEditar); if(ev) Object.assign(ev, datos); UI.evEditar = null; }
    else EVENTOS().push({id:uid(), ...datos});
    UI.calSel = fecha; UI.calMes = fecha.slice(0,7);
    marcar('eventos'); toast('Actividad agendada'); render(false);
  }
  if(id === 'f-mov'){
    e.preventDefault();
    const monto = numero($('#m-monto').value), desc = $('#m-desc').value.trim(), fecha = $('#m-fecha').value;
    if(!desc || !fecha || monto <= 0){ ($('#m-desc').value.trim() ? $('#m-monto') : $('#m-desc')).focus(); return; }
    S.eco.movimientos.push({id:uid(), fecha, desc, tipo:$('#m-tipo').value, cat:$('#m-cat').value, monto});
    UI.mesMov = fecha.slice(0,7);
    marcar('eco'); toast('Movimiento registrado'); render(false); const f = $('#m-desc'); if(f) f.focus();
  }
});

document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if(el.id === 'hero-ia-txt'){ UI.heroTexto = el.value; return; }
  if(el.id === 'ia-txt'){ UI.iaTexto = el.value; return; }
  if(el.id === 'chat-txt'){ UI.chatTexto = el.value; return; }
  if(d.iasel){ UI.iaSel[d.iasel] = el.checked; el.closest('.res-item')?.classList.toggle('off', !el.checked); const b = document.querySelector('[data-act="ia-aplicar"]'); const n = Object.values(UI.iaSel).filter(Boolean).length; if(b) b.textContent = `Guardar ${n} seleccionados`; return; }
  if(d.col && d.f && COL[d.col]){
    const [get, doc] = COL[d.col]; const x = get().find(z => z.id === d.id); if(!x) return;
    x[d.f] = d.n ? (d.f === 'cant' ? numeroSimple(el.value) : numero(el.value)) : el.value;
    marcar(doc); vivos(); return;
  }
  if(d.ahorro != null){ if(!S.eco.ahorro[UI.anioAhorro]) S.eco.ahorro[UI.anioAhorro] = Array(12).fill(0); S.eco.ahorro[UI.anioAhorro][Number(d.ahorro)] = numero(el.value); marcar('eco'); vivos(); return; }
  if(d.pres){ S.pres.borrador[d.pres] = el.value; marcar('pres'); vivos(); return; }
  if(d.perfil){ S.perfil[d.perfil] = el.value; marcar('perfil'); vivos(); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 't-filtro-area'){ UI.tArea = el.value; render(false); return; }
  if(el.id === 't-ver-hechas'){ UI.tHechas = el.checked; render(false); return; }
  if(el.id === 'ia-img'){
    const files = [...el.files].filter(f => f.type.startsWith('image/')).slice(0, 4 - UI.iaImgs.length);
    files.forEach(f => UI.iaImgs.push({blob:f, url:URL.createObjectURL(f)}));
    el.value = ''; render(false); return;
  }
  if(el.id === 'aj-importar'){
    const file = el.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => { try { importarDatos(JSON.parse(rd.result)); cerrarModal(); toast('Copia restaurada'); render(true); } catch(ex){ const m = $('#aj-msg-bk'); if(m){ m.textContent = 'Ese archivo no es una copia válida de este sitio.'; m.className = 'msg err'; } } };
    rd.readAsText(file); return;
  }
  if(el.dataset.hist){ const h = S.pres.historial.find(x => x.id === el.dataset.hist); if(h){ h.estado = el.value; marcar('pres'); render(false); } return; }
  if(el.tagName === 'SELECT' && el.dataset.col){ render(false); return; }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#modal-root').innerHTML) cerrarModal();
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
    if(e.target.id === 'ia-txt'){ e.preventDefault(); iaOrdenar(); }
    if(e.target.id === 'hero-ia-txt'){ e.preventDefault(); $('#f-hero-ia').requestSubmit(); }
  }
});
document.addEventListener('paste', e => {
  if(UI.vista !== 'ia' || UI.iaModo !== 'ordenar') return;
  const imgs = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if(imgs.length){ e.preventDefault(); imgs.slice(0, 4 - UI.iaImgs.length).forEach(f => UI.iaImgs.push({blob:f, url:URL.createObjectURL(f)})); render(false); toast('Captura adjuntada'); }
});
/* Arrastrar tareas entre columnas */
document.addEventListener('dragstart', e => { const li = e.target.closest && e.target.closest('.tarea[draggable="true"]'); if(!li) return; e.dataTransfer.setData('text/plain', li.dataset.tid); e.dataTransfer.effectAllowed = 'move'; li.classList.add('arrastrando'); });
document.addEventListener('dragend', e => { document.querySelectorAll('.arrastrando,.sobre').forEach(x => x.classList.remove('arrastrando','sobre')); });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if(!c) return; e.preventDefault(); document.querySelectorAll('.sobre').forEach(x => x !== c && x.classList.remove('sobre')); c.classList.add('sobre'); });
document.addEventListener('drop', e => {
  const c = e.target.closest && e.target.closest('[data-drop]'); if(!c) return; e.preventDefault();
  const t = TAREAS().find(x => x.id === e.dataTransfer.getData('text/plain')); if(!t) return;
  if(t.plazo !== c.dataset.drop || t.diaria){ t.plazo = c.dataset.drop; if(c.dataset.drop !== 'hoy') t.diaria = false; marcar('tareas'); toast('Movida a ' + ({hoy:'Hoy', corto:'Corto plazo', largo:'Largo plazo'})[c.dataset.drop]); }
  render(false);
});
/* Reloj del inicio */
setInterval(() => { document.querySelectorAll('[data-reloj]').forEach(el => el.textContent = reloj()); }, 10000);
/* Si el día cambia con la página abierta, se refresca */
let diaActual = hoyISO();
setInterval(() => { if(hoyISO() !== diaActual){ diaActual = hoyISO(); UI.respaldoHecho = false; respaldoDiario(); render(false); } }, 60000);

/* ---------------- Arranque ---------------- */
const h0 = location.hash.slice(1); if(VISTAS.some(v => v.id === h0)) UI.vista = h0;
pintarShell(); render(true);
conectar();
})();
</script>

if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
